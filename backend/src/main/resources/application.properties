import io.jsonwebtoken.security.Keys;
import java.security.Key;
import java.util.Base64;

spring.application.name=agrichain

ethereum.contract.address=${ETH_CONTRACT_ADDRESS:0x086203B676Ca9A5b29bfC16e8983dBeD1A31268c}
ethereum.node.url=${ETH_NODE_URL:http://localhost:9545}
ethereum.private.key=${ETH_PRIVATE_KEY:dummy_private_key}

cors.allowed.origins=http://localhost:3001

spring.datasource.url=jdbc:mysql://localhost:3306/agrotrust
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:@Root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Increase file upload size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8080

jwt.secret=${JWT_SECRET:agrichainSuperSecretKeyForJwtSecurityVeryStrong512BitSecretKey1234567890ABCDEFFEDCBA0987654321}
jwt.expiration=86400000

# Serve files from uploads directory
spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.static-locations=file:uploads/
